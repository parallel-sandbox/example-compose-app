services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      WORKER_URL: http://worker:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  worker:
    build: ./worker
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
